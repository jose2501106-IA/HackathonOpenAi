<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>¿Ya cayó?</title>
  <meta name="description" content="Caja de cobro CoDi sin comisión: la captura no es dinero, pey confirma si ya cayó el pago.">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="modulepreload" href="js/textos.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/estado-pago.js">
  <link rel="modulepreload" href="js/revisar.js">
  <script type="module" src="js/app.js"></script>
</head>
<body data-vista="pedido" data-modo="cargando">
  <!-- Íconos (se usan con <use href="#i-…">) -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
    <symbol id="i-camara" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-imagen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
    <symbol id="i-recibo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
    <symbol id="i-palomita" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></symbol>
    <symbol id="i-alto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/><path d="M12 7v6M12 16.5v.5"/></symbol>
    <symbol id="i-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></symbol>
    <symbol id="i-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-refrescar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></symbol>
  </svg>

  <a class="saltar" href="#principal" data-t="saltar"></a>

  <header class="encabezado">
    <div class="encabezado__fila">
      <p class="marca">
        <svg class="marca__logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="16" fill="#0f172a"/>
          <path d="M32 7v9M24 10l3 6M40 10l-3 6" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
          <circle cx="32" cy="38" r="17" fill="#0a7d32"/>
          <path d="M24 38.5l5.5 5.5L41 32" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="marca__nombre" data-t="marca"></span>
      </p>
      <p id="insignia-modo" class="insignia insignia--cargando" role="status">
        <span class="visualmente-oculto" data-t="modo.etiqueta"></span>
        <span class="visualmente-oculto">: </span>
        <span id="insignia-texto" data-t="modo.cargando"></span>
      </p>
    </div>
    <p class="lema" data-t="lema"></p>
  </header>

  <p id="banner-modo" class="banner" hidden></p>

  <main id="principal" tabindex="-1">
    <!-- ===== Vista 1 · Pedido ===== -->
    <section id="vista-pedido" class="vista" aria-labelledby="titulo-pedido">
      <form id="form-pedido" class="tarjeta" novalidate>
        <h1 id="titulo-pedido" class="titulo" tabindex="-1"><label for="campo-pedido" data-t="pedido.titulo"></label></h1>
        <p id="ayuda-pedido" class="ayuda" data-t="pedido.ayuda"></p>
        <div class="campo-pedido">
          <input id="campo-pedido" class="entrada" name="texto" type="text" maxlength="300" autocomplete="off"
                 enterkeyhint="send" aria-describedby="ayuda-pedido error-pedido" data-t-placeholder="pedido.placeholder">
          <button id="btn-microfono" class="boton-icono" type="button" aria-pressed="false" hidden data-t-aria-label="pedido.microfono">
            <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-mic"/></svg>
          </button>
        </div>
        <p id="estado-microfono" class="ayuda ayuda--viva" aria-live="polite" hidden></p>
        <div class="ejemplos" role="group" aria-labelledby="titulo-ejemplos">
          <span id="titulo-ejemplos" class="ejemplos__titulo" data-t="pedido.ejemplosTitulo"></span>
          <button class="chip" type="button" data-ejemplo="0" data-t="pedido.ejemplos.0"></button>
          <button class="chip" type="button" data-ejemplo="1" data-t="pedido.ejemplos.1"></button>
        </div>
        <p id="error-pedido" class="mensaje-error" role="alert" hidden></p>
        <button id="btn-entender" class="boton boton--primario boton--grande" type="submit"><span data-t="pedido.enviar"></span></button>
        <button id="btn-manual" class="boton-enlace" type="button" data-t="pedido.manual"></button>
      </form>

      <form id="form-propuesta" class="tarjeta tarjeta--propuesta" novalidate hidden aria-labelledby="titulo-propuesta">
        <div class="propuesta__cabecera">
          <h2 id="titulo-propuesta" class="subtitulo" tabindex="-1" data-t="propuesta.titulo"></h2>
          <span id="propuesta-origen" class="etiqueta" hidden></span>
        </div>
        <p id="propuesta-pediste" class="pediste" hidden></p>
        <p id="propuesta-respuesta" class="respuesta-ia" hidden></p>
        <div id="propuesta-detalle-caja" hidden>
          <h3 class="visualmente-oculto" data-t="propuesta.detalle"></h3>
          <ul id="propuesta-detalle" class="detalle"></ul>
        </div>
        <div class="campo">
          <label for="campo-concepto" data-t="propuesta.concepto"></label>
          <input id="campo-concepto" class="entrada" type="text" maxlength="40" autocomplete="off" aria-describedby="ayuda-concepto">
          <p id="ayuda-concepto" class="ayuda" data-t="propuesta.conceptoAyuda"></p>
        </div>
        <div class="campo">
          <label for="campo-monto" data-t="propuesta.monto"></label>
          <div class="campo-monto">
            <span class="campo-monto__signo" aria-hidden="true">$</span>
            <input id="campo-monto" class="entrada entrada--monto" type="text" inputmode="decimal" autocomplete="off" aria-describedby="ayuda-monto">
          </div>
          <p id="ayuda-monto" class="ayuda"></p>
        </div>
        <p id="error-propuesta" class="mensaje-error" role="alert" hidden></p>
        <button id="btn-confirmar" class="boton boton--primario boton--grande" type="submit" disabled><span data-t="propuesta.confirmar"></span></button>
        <button id="btn-cambiar" class="boton boton--secundario" type="button"><span data-t="propuesta.cambiar"></span></button>
      </form>

      <button class="boton boton--terciario" type="button" data-abrir-revision>
        <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-recibo"/></svg>
        <span data-t="pedido.revisar"></span>
      </button>
    </section>

    <!-- ===== Vista 2 · QR ===== -->
    <section id="vista-qr" class="vista" aria-labelledby="titulo-qr" hidden>
      <div class="tarjeta tarjeta--qr">
        <h1 id="titulo-qr" class="qr__titulo" tabindex="-1" data-t="qr.titulo"></h1>
        <p id="qr-concepto" class="qr__concepto"></p>
        <p id="qr-monto" class="qr__monto"></p>
        <figure id="qr-figura" class="qr__figura">
          <div class="qr__marco">
            <p id="qr-sello" class="qr__sello" hidden data-t="qr.sello"></p>
            <img id="qr-imagen" class="qr__imagen" alt="" width="300" height="300">
            <p id="qr-vencido" class="qr__vencido" hidden data-t="qr.vencioCorto"></p>
          </div>
          <p id="qr-sin-imagen" class="mensaje-error" hidden data-t="qr.sinImagen"></p>
        </figure>
        <div class="cuenta">
          <div class="cuenta__fila">
            <p id="qr-vence" class="cuenta__texto"></p>
            <p id="qr-ref" class="qr__ref"></p>
          </div>
          <div class="barra" aria-hidden="true"><div id="qr-barra" class="barra__relleno"></div></div>
        </div>
        <p id="qr-estado" class="estado-pago estado-pago--esperando" role="status" aria-live="polite">
          <span class="estado-pago__punto" aria-hidden="true"></span>
          <span id="qr-estado-texto"></span>
        </p>
        <p id="error-qr" class="mensaje-error" role="alert" hidden></p>
        <button id="btn-ya-cayo" class="boton boton--primario boton--grande" type="button">
          <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-refrescar"/></svg>
          <span data-t="qr.yaCayo"></span>
        </button>
        <button id="btn-revisar-qr" class="boton boton--secundario" type="button" data-abrir-revision>
          <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-recibo"/></svg>
          <span data-t="qr.revisar"></span>
        </button>
        <button id="btn-simular" class="boton boton--simular" type="button" hidden><span data-t="qr.simular"></span></button>
        <button id="btn-otro" class="boton-enlace" type="button" data-t="qr.otro"></button>
      </div>
    </section>

    <!-- ===== Vista 3 · ¡Ya cayó! ===== -->
    <section id="vista-pagado" class="vista vista--pagado" aria-labelledby="titulo-pagado" hidden>
      <div class="pagado">
        <svg class="pagado__icono" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
          <circle cx="60" cy="60" r="54" fill="#fff"/>
          <path class="pagado__palomita" d="M34 62l17 17 36-38" fill="none" stroke="#0a7d32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 id="titulo-pagado" class="pagado__titulo" tabindex="-1" data-t="pagado.titulo"></h1>
        <p id="pagado-monto" class="pagado__monto"></p>
        <p id="pagado-fuente" class="pagado__fuente"></p>
        <p id="pagado-detalle" class="pagado__detalle"></p>
        <p class="pagado__entrega" data-t="pagado.entrega"></p>
        <p id="pagado-ref" class="pagado__ref"></p>
        <button id="btn-nuevo-cobro" class="boton boton--blanco boton--grande" type="button"><span data-t="pagado.nuevo"></span></button>
      </div>
    </section>
  </main>

  <footer class="pie">
    <p data-t="pie.servicios"></p>
    <p class="pie__ley" data-t="pie.ley"></p>
    <button id="btn-como" class="boton-enlace" type="button" data-t="pie.como"></button>
  </footer>

  <!-- ===== Revisar una captura (js/revisar.js) ===== -->
  <dialog id="dialogo-revision" class="dialogo" aria-labelledby="titulo-revision">
    <div class="dialogo__marco">
      <div class="dialogo__cabecera">
        <h2 id="titulo-revision" class="subtitulo" tabindex="-1" data-t="revision.titulo"></h2>
        <button class="boton-icono boton-icono--plano" type="button" data-cerrar data-t-aria-label="comun.cerrar">
          <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-cerrar"/></svg>
        </button>
      </div>
      <div class="dialogo__cuerpo">
        <p class="revision__regla" data-t="revision.regla"></p>
        <p id="revision-contexto" class="revision__contexto"></p>

        <div id="revision-acciones" class="revision__acciones">
          <button id="revision-btn-foto" class="boton boton--primario" type="button">
            <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-camara"/></svg>
            <span data-t="revision.foto"></span>
          </button>
          <button id="revision-btn-archivo" class="boton boton--secundario" type="button">
            <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-imagen"/></svg>
            <span data-t="revision.archivo"></span>
          </button>
          <button id="revision-btn-ejemplo" class="boton boton--secundario" type="button">
            <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-recibo"/></svg>
            <span data-t="revision.ejemplo"></span>
          </button>
          <input id="revision-foto" type="file" accept="image/*" capture="environment" hidden>
          <input id="revision-archivo" type="file" accept="image/*" hidden>
        </div>

        <p id="revision-error" class="mensaje-error" role="alert" hidden></p>

        <div id="revision-resultado" class="revision__resultado" hidden>
          <div id="revision-veredicto" class="veredicto">
            <svg class="veredicto__icono" aria-hidden="true" focusable="false"><use id="revision-veredicto-uso" href="#i-alto"/></svg>
            <h3 id="revision-veredicto-titulo" class="veredicto__titulo" tabindex="-1"></h3>
            <p id="revision-veredicto-mensaje" class="veredicto__mensaje"></p>
            <p id="revision-veredicto-detalle" class="veredicto__detalle"></p>
          </div>
          <p id="revision-pago" class="revision__pago" hidden></p>
          <div class="leido">
            <div class="leido__cabecera">
              <h3 class="leido__titulo" data-t="revision.leidoTitulo"></h3>
              <span id="revision-origen" class="etiqueta"></span>
            </div>
            <dl id="revision-leido" class="leido__datos"></dl>
            <p id="revision-nota" class="ayuda" hidden></p>
          </div>
        </div>

        <figure id="revision-vista-previa" class="revision__previa" hidden>
          <div class="revision__previa-marco">
            <img id="revision-imagen" alt="">
          </div>
          <figcaption id="revision-pie"></figcaption>
        </figure>

        <p id="revision-cargando" class="revision__cargando" role="status" hidden>
          <span class="girando" aria-hidden="true"></span>
          <span id="revision-cargando-texto"></span>
        </p>

        <button id="revision-btn-manual" class="boton-enlace" type="button" aria-expanded="false" aria-controls="revision-form-manual" data-t="revision.manualAbrir"></button>
        <form id="revision-form-manual" class="revision__manual" novalidate hidden>
          <label for="revision-monto" data-t="revision.manualTitulo"></label>
          <p id="revision-manual-ayuda" class="ayuda" data-t="revision.manualAyuda"></p>
          <div class="campo-monto">
            <span class="campo-monto__signo" aria-hidden="true">$</span>
            <input id="revision-monto" class="entrada entrada--monto" type="text" inputmode="decimal" autocomplete="off" aria-describedby="revision-manual-ayuda">
          </div>
          <button class="boton boton--primario" type="submit"><span data-t="revision.manualEnviar"></span></button>
        </form>

        <div id="revision-pie-acciones" class="revision__pie" hidden>
          <button id="revision-btn-otra" class="boton boton--secundario" type="button"><span data-t="revision.otra"></span></button>
          <button id="revision-btn-volver" class="boton boton--primario" type="button" data-cerrar></button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- ===== Cómo funciona ===== -->
  <dialog id="dialogo-como" class="dialogo dialogo--chico" aria-labelledby="titulo-como">
    <div class="dialogo__marco">
      <div class="dialogo__cabecera">
        <h2 id="titulo-como" class="subtitulo" tabindex="-1" data-t="como.titulo"></h2>
        <button class="boton-icono boton-icono--plano" type="button" data-cerrar data-t-aria-label="comun.cerrar">
          <svg class="icono" aria-hidden="true" focusable="false"><use href="#i-cerrar"/></svg>
        </button>
      </div>
      <div class="dialogo__cuerpo">
        <ol class="pasos">
          <li><h3 data-t="como.pasos.0.titulo"></h3><p data-t="como.pasos.0.texto"></p></li>
          <li><h3 data-t="como.pasos.1.titulo"></h3><p data-t="como.pasos.1.texto"></p></li>
          <li><h3 data-t="como.pasos.2.titulo"></h3><p data-t="como.pasos.2.texto"></p></li>
        </ol>
        <p class="ayuda" data-t="como.nota"></p>
        <button class="boton boton--primario" type="button" data-cerrar><span data-t="como.cerrar"></span></button>
      </div>
    </div>
  </dialog>

  <noscript><p class="mensaje-error">Activa JavaScript para usar ¿Ya cayó?</p></noscript>
</body>
</html>
