<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punto de venta · Tacos El Gran Abanico</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <script type="module" src="/js/caja.js"></script>
</head>
<body>
  <div id="franja" class="franja" role="status" hidden></div>
  <header class="encabezado">
    <h1>Tacos El Gran Abanico</h1>
    <p>Punto de venta · cobro con CoDi®</p>
  </header>

  <section id="vista-pin" class="contenedor" hidden aria-labelledby="titulo-pin">
    <form id="form-pin" class="tarjeta">
      <h2 id="titulo-pin">Entrar a la caja</h2>
      <label for="pin">PIN de caja</label>
      <input id="pin" type="password" autocomplete="current-password" inputmode="numeric" required>
      <p id="error-pin" class="nota" role="alert"></p>
      <button type="submit" class="boton-grande">Entrar</button>
    </form>
  </section>

  <div id="vista-caja" hidden>
    <nav class="pestanas" role="tablist" aria-label="Secciones de la caja">
      <button role="tab" id="tab-mesas" aria-controls="panel-mesas" aria-selected="true">Mesas</button>
      <button role="tab" id="tab-inventario" aria-controls="panel-inventario" aria-selected="false" tabindex="-1">Inventario</button>
      <button role="tab" id="tab-reporte" aria-controls="panel-reporte" aria-selected="false" tabindex="-1">Reporte</button>
    </nav>
    <main class="contenedor">
      <div id="error-global" class="aviso aviso-error" role="alert" hidden></div>

      <section id="panel-mesas" role="tabpanel" aria-labelledby="tab-mesas">
        <h2 class="oculto-visual">Mesas</h2>
        <div id="mesas" class="mesas"></div>
        <div id="detalle-mesa"></div>
      </section>

      <section id="panel-inventario" role="tabpanel" aria-labelledby="tab-inventario" hidden>
        <div class="tarjeta">
          <h2>Inventario de ingredientes</h2>
          <p class="nota">Se descuenta solo cuando pey confirma el pago.</p>
          <div id="inventario" class="tabla-env"></div>
        </div>
      </section>

      <section id="panel-reporte" role="tabpanel" aria-labelledby="tab-reporte" hidden>
        <div class="tarjeta">
          <h2>Reporte de ventas</h2>
          <div class="fila">
            <div>
              <label for="fecha">Fecha</label>
              <input id="fecha" type="date">
            </div>
          </div>
        </div>
        <div id="reporte"></div>
        <div class="tarjeta">
          <h2>Análisis con IA</h2>
          <p class="nota">Sugerencias de reabastecimiento a partir de las ventas y el inventario.</p>
          <button id="btn-analisis" type="button" class="boton-sec">Análisis con IA</button>
          <div id="analisis" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
